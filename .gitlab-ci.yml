---
stages:
  - test

cache:
  key: perl-local-lib-shared-between-all-branches
  paths:
    - perl5/

prove:
  stage: test
  image: perl:latest

  before_script:
    - DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install --yes postgresql
    - PERL5LIB=perl5/lib/perl5/ cpanm --notest --local-lib perl5/ -v local::lib
    - 'eval "$( perl -Iperl5/lib/perl5/ -Mlocal::lib=perl5/ )"'
    - cpanm --notest --installdeps --with-configure --with-develop --with-recommends .
    - cpanm --notest Devel::Cover

  script:
    - perl Makefile.PL
    - AUTHOR_TESTING=1 cover -ignore_re ^perl5/ -make 'make TEST_VERBOSE=1' -test

  after_script:
    - 'eval "$( perl -Iperl5/lib/perl5/ -Mlocal::lib=perl5/ )"'
    - cover -summary | perl -nE '/^Total .+ (\d+\.\d+)$/ and say "TOTAL COVERAGE $1" '

  coverage: '/TOTAL COVERAGE/'
