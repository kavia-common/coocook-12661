---
stages:
  - test

cache:
  key: perl-local-lib-shared-between-all-branches
  paths:
    - perl5/

prove:
  stage: test
  image: perl:latest

  before_script:
    # provide PostgreSQL binaries for Test::PostgreSQL
    - DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install --yes postgresql

    # install coverage analyzer, install and activate local::lib
    - PERL5LIB=perl5/lib/perl5/ cpanm --notest --local-lib perl5/ -v Devel::Cover local::lib
    - 'eval "$( perl -Iperl5/lib/perl5/ -Mlocal::lib=perl5/ )"'

    # install our dependencies
    - cpanm --notest --installdeps --with-configure --with-develop --with-recommends .

  script:
    - perl Makefile.PL
    - AUTHOR_TESTING=1 cover -ignore_re ^perl5/ -ignore_re SHSchema -make 'make TEST_VERBOSE=1' -test

  coverage: '/^Total .+ (\d+\.\d+)$/'
